# Retry the existing release after the GitHub Actions outage on 2026-11-11.
name: Publish Combat Punchy 1.3.1
on:
  push:
    branches: [publish/combat-punchy-1.3.1]
    paths:
      - '.github/workflows/publish-combat-punchy-1.3.1.yml'
      - '.github/scripts/publish_combat_punchy.py'
      - '.github/publish/combat-punchy/files/**'
      - '.github/publish/combat-punchy/releases/**'
      - '.github/publish/combat-punchy/changelog.html'
concurrency:
  group: curseforge-publish-combat-punchy-1.3.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload the two verified Combat Punchy 1.3.1 files
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_combat_punchy.py --version 1.3.1 --publish
