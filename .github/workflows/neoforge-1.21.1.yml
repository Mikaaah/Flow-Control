name: NeoForge 1.21.1 build

on:
  push:
    branches:
      - "gui/**"
      - "update/**"
      - main
      - fix/neoforge-1.21.1-stillwater-render
  pull_request:
    branches:
      - main
      - gui/controller-layout
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [standalone, create]
    runs-on: ubuntu-latest
    env:
      CREATE_ARGS: ${{ matrix.flavor == 'create' && '-PwithCreate' || '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch Streams Reflowing 2.17.1 (build dependency)
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 \
            --output libs/StreamsReflowing-1.21.1-neoforge-2.17.1.jar \
            https://cdn.modrinth.com/data/oLS8HdJ1/versions/uKeyx6DB/StreamsReflowing-1.21.1-neoforge-2.17.1.jar
          sha256sum --check <<'HASH'
          50d0a6879c7c79fc8c882209bad364b64920a6fafa660e9e98e650adf305332c  libs/StreamsReflowing-1.21.1-neoforge-2.17.1.jar
          HASH
      - name: Fetch verified optional Create compile fixture
        run: python3 tools/fetch_create.py
      - name: Compile and package addon
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon $CREATE_ARGS clean build
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.0-neoforge-1.21.1-${{ matrix.flavor }}
          path: build/libs/flow-control-*.jar
          if-no-files-found: error

      - name: Check eight-way flow on the dedicated server
        run: |
          mkdir -p run/config
          echo 'eula=true' > run/eula.txt
          echo 'forceBakedFluid=true' > run/config/streamsreflowing.properties
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
          timeout 300 ./gradlew --no-daemon -Dstreamcontrol.integrationTest=true $CREATE_ARGS runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.0-neoforge-1.21.1-${{ matrix.flavor }}-checks
          path: |
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: Capture the actual controller GUIs
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\ntutorialStep:none\nfullscreen:false\n' > run-client/options.txt
          timeout 360 xvfb-run -a ./gradlew --no-daemon -Dstreamcontrol.uiPreview=true $CREATE_ARGS runClient
          test -s run-client/screenshots/flow-control-current-generator.png
          test -s run-client/screenshots/flow-control-stillwater-anchor.png
          test -s run-client/screenshots/flow-control-redstone-paused.png
          test -s run-client/screenshots/flow-control-automation.png
          test -s run-client/screenshots/flow-control-flow-sensor.png
          test -s run-client/screenshots/flow-control-mooring-post.png
          test -s run-client/screenshots/flow-control-block-models.png
          test -s run-client/screenshots/flow-control-mechanical-controller.png
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.0-${{ matrix.flavor }}-client-preview
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log

      - name: Exercise real client gameplay against a dedicated server
        run: |
          rm -f run/client-test-ready
          ./gradlew --no-daemon -Dstreamcontrol.clientTestServer=true $CREATE_ARGS runServer > client-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" $(jobs -pr) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if test -s run/client-test-ready; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then tail -n 50 client-test-server.log; exit 1; fi
            sleep 1
          done
          test -s run/client-test-ready
          timeout 600 xvfb-run -a ./gradlew --no-daemon -Dstreamcontrol.clientIntegrationTest=true $CREATE_ARGS runClient
          python3 - <<'CHECK'
          import json
          data=json.load(open('run-client/streamcontrol-client-results.json'))
          assert data.get('passed') is True, data
          CHECK
      - name: Upload live client results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.0-${{ matrix.flavor }}-client-gameplay
          path: |
            run-client/streamcontrol-client-results.json
            run-client/screenshots/gameplay-*.png
            run-client/logs/latest.log
            client-test-server.log
