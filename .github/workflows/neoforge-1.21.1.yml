name: NeoForge 1.21.1 build

on:
  push:
    branches:
      - main
      - fix/neoforge-1.21.1-stillwater-render
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch Streams Reflowing 2.15.2 (build dependency)
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 \
            --output libs/StreamsReflowing-1.21.1-neoforge-2.15.2.jar \
            https://cdn.modrinth.com/data/oLS8HdJ1/versions/vbJ5meb8/StreamsReflowing-1.21.1-neoforge-2.15.2.jar
          test -s libs/StreamsReflowing-1.21.1-neoforge-2.15.2.jar
      - name: Compile and package addon
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-0.1.5-neoforge-1.21.1
          path: build/libs/flow-control-*.jar
          if-no-files-found: error

      - name: Check eight-way flow on the dedicated server
        run: |
          mkdir -p run/config
          echo 'eula=true' > run/eula.txt
          echo 'forceBakedFluid=true' > run/config/streamsreflowing.properties
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
          timeout 300 ./gradlew --no-daemon -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-0.1.5-neoforge-1.21.1-checks
          path: |
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: Capture the actual controller GUIs
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\nfullscreen:false\n' > run-client/options.txt
          timeout 360 xvfb-run -a ./gradlew --no-daemon -Dstreamcontrol.uiPreview=true runClient
          test -s run-client/screenshots/flow-control-current-generator.png
          test -s run-client/screenshots/flow-control-stillwater-anchor.png
          test -s run-client/screenshots/flow-control-redstone-paused.png
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-0.1.5-client-preview
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log
