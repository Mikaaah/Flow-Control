name: Publish Resonant Arcana 1.1.1
on:
  push:
    branches: [publish/resonant-arcana-1.1.1]
    paths:
      - '.github/workflows/publish-resonant-arcana-1.1.1.yml'
      - '.github/scripts/publish_resonant_arcana.py'
      - '.github/publish/resonant-arcana/files/**'
      - '.github/publish/resonant-arcana/releases/**'
      - '.github/publish/resonant-arcana/changelog-1.1.1.html'
concurrency:
  group: curseforge-publish-resonant-arcana-1.1.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the verified Resonant Arcana 1.1.1 file
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_resonant_arcana.py --version 1.1.1 --publish

