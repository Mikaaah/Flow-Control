name: fabric 1.20.1 build and regression
on:
  push:
    branches: ["gui/**", "feature/**", "update/**", 'fabric/1.20.1']
  pull_request:
    branches: ['fabric/1.20.1']
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        flavor: [standalone, create]
    env:
      CREATE_ARGS: ${{ matrix.flavor == 'create' && '-PwithCreate' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned Streams dependency
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/oLS8HdJ1/versions/Ng83x78v/StreamsReflowing-1.20.1-fabric-2.17.3.jar' -o 'libs/StreamsReflowing-1.20.1-fabric-2.17.3.jar'
          echo '2fda2d92af8d9b532eb95266ebf883f2cc369258f3785a641a3e582b404dec60  libs/StreamsReflowing-1.20.1-fabric-2.17.3.jar' | sha256sum --check
      - name: Fetch optional Create fixture
        run: python3 tools/fetch_create.py
      - name: Build
        run: bash gradlew --no-daemon $CREATE_ARGS clean build
      - name: Prepare disposable regression world
        run: |
          mkdir -p run/config
          echo 'forceBakedFluid=true' > run/config/streamsreflowing.properties
          echo 'eula=true' > run/eula.txt
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
      - name: Dedicated server regression
        run: |
          timeout 300 bash gradlew --no-daemon $CREATE_ARGS -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('controllerGuiAndConnectedWaterRegression') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: Upload JARs and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-fabric-1.20.1-1.0.1-${{ matrix.flavor }}
          path: |
            build/libs/*.jar
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: Capture client menus and baked block models
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\nfullscreen:false\n' > run-client/options.txt
          timeout 360 xvfb-run -a bash gradlew --no-daemon $CREATE_ARGS -Dstreamcontrol.uiPreview=true runClient
          test -s run-client/screenshots/flow-control-block-models.png
      - name: Upload client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.1-fabric-1.20.1-${{ matrix.flavor }}-client
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log
