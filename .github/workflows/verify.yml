name: neoforge 26.1.2 build and regression
on:
  push:
    branches: ["gui/**", "feature/**", "update/**", 'neoforge/26.1.2']
  pull_request:
    branches: ['neoforge/26.1.2']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned Streams dependency
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/oLS8HdJ1/versions/LRMip4e0/StreamsReflowing-26.1.2-neoforge-2.17.1.jar' -o 'libs/StreamsReflowing-26.1.2-neoforge-2.17.1.jar'
          echo '59c57a9fd03c23bc5de0029e5f14b1ab2f9a0c6dcfa249e9750b0e9291ac6010  libs/StreamsReflowing-26.1.2-neoforge-2.17.1.jar' | sha256sum --check
      - name: Build
        run: bash gradlew --no-daemon clean build
      - name: Prepare disposable regression world
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
      - name: Dedicated server regression
        run: |
          timeout 300 bash gradlew --no-daemon -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('controllerGuiAndConnectedWaterRegression') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: Upload JARs and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-neoforge-26.1.2-1.0.0
          path: |
            build/libs/*.jar
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: Capture client menus and baked block models
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\nfullscreen:false\n' > run-client/options.txt
          bash gradlew --no-daemon runServer > client-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" $(jobs -pr) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if rg -q 'Done \(' client-preview-server.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then tail -n 40 client-preview-server.log; exit 1; fi
            sleep 1
          done
          timeout 360 xvfb-run -a bash gradlew --no-daemon -Dstreamcontrol.uiPreview=true runClient
          test -s run-client/screenshots/flow-control-block-models.png
      - name: Upload client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.0-neoforge-26.1.2-client
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log
            client-preview-server.log
