name: fabric 1.21.1 build and regression
on:
  push:
    branches: ["gui/**", "feature/**", "update/**", 'fabric/1.21.1']
  pull_request:
    branches: ['fabric/1.21.1']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: fetch streams
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/oLS8HdJ1/versions/rF5gb89d/StreamsReflowing-1.21.1-fabric-2.17.5.jar' -o 'libs/StreamsReflowing-1.21.1-fabric-2.17.5.jar'
          echo 'b4e0803602371ebad0f4940a835461e81d564bd68a4a2584bbf6180ad0663fc6  libs/StreamsReflowing-1.21.1-fabric-2.17.5.jar' | sha256sum --check
      - name: build
        run: bash gradlew --no-daemon clean build
      - name: prepare test world
        run: |
          mkdir -p run/config
          echo 'forceBakedFluid=true' > run/config/streamsreflowing.properties
          echo 'eula=true' > run/eula.txt
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
      - name: test server
        run: |
          timeout 300 bash gradlew --no-daemon -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('controllerGuiAndConnectedWaterRegression') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          assert data.get('allFiveBlocksWaterloggingRotationAndNonOcclusion') is True, data
          assert data.get('auditControllerUnloadReregistrationAndVisualState') is True, data
          assert data.get('auditSensorSameSignalHeadingAndUpdateTag') is True, data
          CHECK
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-fabric-1.21.1-1.1.0
          path: |
            build/libs/*.jar
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: capture client
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\nfullscreen:false\n' > run-client/options.txt
          timeout 360 xvfb-run -a bash gradlew --no-daemon -Dstreamcontrol.uiPreview=true runClient
          test -s run-client/screenshots/flow-control-block-models.png
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.1.0-fabric-1.21.1-client
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log
