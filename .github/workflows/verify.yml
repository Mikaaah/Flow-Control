name: forge 1.20.1 build and regression
on:
  push:
    branches: ["gui/**", "feature/**", "update/**", 'forge/1.20.1']
  pull_request:
    branches: ['forge/1.20.1']
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        flavor: [standalone, create]
    env:
      CREATE_ARGS: ${{ matrix.flavor == 'create' && '-PwithCreate' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: fetch streams
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/oLS8HdJ1/versions/u6OCuSKK/StreamsReflowing-1.20.1-forge-2.17.5.jar' -o 'libs/StreamsReflowing-1.20.1-forge-2.17.5.jar'
          echo '7c31fc5f74ed083324ed58f11edfd5925b5bd01a0c04538eef5bbcf7fe7affff  libs/StreamsReflowing-1.20.1-forge-2.17.5.jar' | sha256sum --check
      - name: fetch create
        run: python3 tools/fetch_create.py
      - name: build
        run: bash gradlew --no-daemon $CREATE_ARGS clean build
      - name: prepare test world
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
      - name: test server
        run: |
          timeout 300 bash gradlew --no-daemon $CREATE_ARGS -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('controllerGuiAndConnectedWaterRegression') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-forge-1.20.1-1.0.3-${{ matrix.flavor }}
          path: |
            build/libs/*.jar
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: capture gui
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\nfullscreen:false\n' > run-client/options.txt
          timeout 360 xvfb-run -a bash gradlew --no-daemon $CREATE_ARGS -Dstreamcontrol.uiPreview=true runClient
          test -s run-client/screenshots/flow-control-block-models.png
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.3-forge-1.20.1-${{ matrix.flavor }}-client
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log
