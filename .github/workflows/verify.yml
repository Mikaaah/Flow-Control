name: neoforge 26.3 build and regression
on:
  push:
    branches: ["gui/**", "feature/**", "update/**", 'neoforge/26.3']
  pull_request:
    branches: ['neoforge/26.3']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: fetch streams
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/oLS8HdJ1/versions/cthBa6p6/StreamsReflowing-26.3-neoforge-2.17.5.jar' -o 'libs/StreamsReflowing-26.3-neoforge-2.17.5.jar'
          echo '967315e636e65dc8ee3a3ae02f1719147512c2ebb3b36482c72b43f74f8a4e06  libs/StreamsReflowing-26.3-neoforge-2.17.5.jar' | sha256sum --check
      - name: build
        run: bash gradlew --no-daemon clean build
      - name: prepare test world
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
      - name: test server
        run: |
          timeout 300 bash gradlew --no-daemon -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('controllerGuiAndConnectedWaterRegression') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-neoforge-26.3-1.0.3
          path: |
            build/libs/*.jar
            run/streamcontrol-integration-results.json
            run/logs/latest.log

      - name: capture gui
        run: |
          mkdir -p run-client
          printf 'onboardAccessibility:false\nguiScale:3\nfullscreen:false\n' > run-client/options.txt
          bash gradlew --no-daemon runServer > client-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" $(jobs -pr) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if rg -q 'Done \(' client-preview-server.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then tail -n 40 client-preview-server.log; exit 1; fi
            sleep 1
          done
          timeout 360 xvfb-run -a bash gradlew --no-daemon -Dstreamcontrol.uiPreview=true runClient
          test -s run-client/screenshots/flow-control-block-models.png
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-1.0.3-neoforge-26.3-client
          path: |
            run-client/screenshots/*.png
            run-client/logs/latest.log
            client-preview-server.log
