name: neoforge 1.21.11 build and regression
on:
  push:
    branches: ['neoforge/1.21.11']
  pull_request:
    branches: ['neoforge/1.21.11']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned Streams dependency
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/oLS8HdJ1/versions/lZmge2d1/StreamsReflowing-1.21.11-neoforge-2.15.2.jar' -o 'libs/StreamsReflowing-1.21.11-neoforge-2.15.2.jar'
      - name: Build
        run: bash gradlew --no-daemon clean build
      - name: Prepare disposable regression world
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'level-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
      - name: Dedicated server regression
        run: |
          timeout 300 bash gradlew --no-daemon -Dstreamcontrol.integrationTest=true runServer
          python3 - <<'CHECK'
          import json
          data=json.load(open('run/streamcontrol-integration-results.json'))
          assert data.get('passed') is True, data
          assert data.get('controllerGuiAndConnectedWaterRegression') is True, data
          assert data.get('eightHeadingPhysicsPersistenceAndPackets') is True, data
          CHECK
      - name: Upload JARs and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-control-neoforge-1.21.11-0.1.5
          path: |
            build/libs/*.jar
            run/streamcontrol-integration-results.json
            run/logs/latest.log
