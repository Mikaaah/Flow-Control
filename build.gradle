plugins { id 'fabric-loom' version '1.11.8'; id 'maven-publish' }
version = new groovy.json.JsonSlurper().parse(file('release.json')).version
group='nl.townsandkingdoms.streamcontrol'
base.archivesName='streams-flow-control-fabric-1.21.1'
repositories { mavenCentral() }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
java.withSourcesJar()
loom {
 mixin { defaultRefmapName='streamcontrol.refmap.json' }
 runs { client { client(); runDir 'run-client'; vmArg '-Dstreamcontrol.uiPreview='+System.getProperty('streamcontrol.uiPreview','false'); programArg '--width'; programArg '960'; programArg '--height'; programArg '720' }; server { server(); runDir 'run'; vmArg '-Dstreamcontrol.integrationTest='+System.getProperty('streamcontrol.integrationTest','false'); vmArg '-Xmx3G'; programArg '--nogui' } }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.18.4'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
 modImplementation files('libs/StreamsReflowing-1.21.1-fabric-2.17.1.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
tasks.named('jar') { from('LICENSE') }


apply from: 'release-tools/gradle/release.gradle'
