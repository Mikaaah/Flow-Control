plugins { id 'fabric-loom' version '1.11.8'; id 'maven-publish' }
version='0.1.3-beta.3'
group='nl.townsandkingdoms.streamcontrol'
base.archivesName='streams-flow-control-fabric-1.20.1'
repositories { mavenCentral() }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
java.withSourcesJar()
loom {
 mixin { defaultRefmapName='streamcontrol.refmap.json' }
 runs { server { server(); runDir 'run'; vmArg '-Dstreamcontrol.integrationTest='+System.getProperty('streamcontrol.integrationTest','false'); vmArg '-Xmx3G'; programArg '--nogui' } }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.18.4'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
 modImplementation files('libs/StreamsReflowing-1.20.1-fabric-2.15.2.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=17 }
tasks.named('jar') { from('LICENSE') }
