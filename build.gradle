plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.3-beta.3'
group = 'nl.townsandkingdoms.streamcontrol'
base.archivesName = 'streams-flow-control-neoforge-1.21.11'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = '21.11.48'
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx3G'
            gameDirectory = file('run')
            systemProperty 'streamcontrol.integrationTest', System.getProperty('streamcontrol.integrationTest', 'false')
        }
    }
    mods { streamcontrol { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/StreamsReflowing-1.21.11-neoforge-2.15.2.jar')

}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE') }
