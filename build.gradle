plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.2.2'
group = 'nl.townsandkingdoms.streamcontrol'
base.archivesName = 'flow-control'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = '21.1.219'
    runs {
        client {
            client()
            gameDirectory = file('run-client')
            programArgument '--width'
            programArgument '960'
            programArgument '--height'
            programArgument '720'
            systemProperty 'streamcontrol.uiPreview', System.getProperty('streamcontrol.uiPreview', 'false')
            systemProperty 'streamcontrol.clientIntegrationTest', System.getProperty('streamcontrol.clientIntegrationTest', 'false')
            jvmArgument '-Xmx2G'
        }
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
            gameDirectory = file('run')
            systemProperty 'streamcontrol.integrationTest', System.getProperty('streamcontrol.integrationTest', 'false')
            systemProperty 'streamcontrol.clientTestServer', System.getProperty('streamcontrol.clientTestServer', 'false')
        }
    }
    mods { streamcontrol { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/StreamsReflowing-1.21.1-neoforge-2.16.2.jar')
    compileOnly files('libs/create-1.21.1-6.0.10.jar')
    compileOnly fileTree('libs/create-compile') { include '*.jar' }
    if (providers.gradleProperty('withCreate').isPresent()) {
        runtimeOnly files('libs/create-1.21.1-6.0.10.jar')
    }
    // Optional local compatibility test fixtures, never included in the published jar.
    if (providers.gradleProperty('withUtf').isPresent()) {
        runtimeOnly files('libs/ultraterraforged-1.0.2+1.21.1-neoforge.jar',
            'libs/ultraterraforged-streams-currents-0.2.1-beta.jar')
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE') }

tasks.named("jar") { archiveFileName = "flow-control-0.2.2-neoforge-1.21.1.jar" }
