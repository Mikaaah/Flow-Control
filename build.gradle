plugins {
 id 'java-library'
 id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}
version = new groovy.json.JsonSlurper().parse(file('release.json')).version
group='nl.townsandkingdoms.streamcontrol'
base.archivesName='streams-flow-control-forge-1.20.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
java.withSourcesJar()
legacyForge {
 version = '1.20.1-47.4.0'
 runs { client { client(); gameDirectory=file('run-client'); systemProperty 'streamcontrol.uiPreview',System.getProperty('streamcontrol.uiPreview','false'); programArgument '--width'; programArgument '960'; programArgument '--height'; programArgument '720' }; server { server(); programArgument '--nogui'; jvmArgument '-Xmx3G'; gameDirectory=file('run'); systemProperty 'streamcontrol.integrationTest', System.getProperty('streamcontrol.integrationTest','false') } }
 mods { streamcontrol { sourceSet sourceSets.main } }
}
repositories { flatDir { dirs 'libs' } }
mixin { add sourceSets.main, 'streamcontrol.refmap.json'; config 'streamcontrol.mixins.json' }
dependencies { modImplementation 'dev.streamsreflowing:StreamsReflowing-1.20.1-forge:2.17.3'; annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=17 }
tasks.named('jar') { from('LICENSE'); manifest.attributes('MixinConfigs':'streamcontrol.mixins.json') }


dependencies {
 modCompileOnly 'com.simibubi.create:create-1.20.1:6.0.8'
 compileOnly fileTree('libs/create-compile') { include '*.jar' }
 if(providers.gradleProperty('withCreate').isPresent()) modRuntimeOnly 'com.simibubi.create:create-1.20.1:6.0.8'
}

apply from: 'release-tools/gradle/release.gradle'
