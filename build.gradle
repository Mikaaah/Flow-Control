plugins { id 'net.fabricmc.fabric-loom' version '1.15.5'; id 'maven-publish' }
version = new groovy.json.JsonSlurper().parse(file('release.json')).version
group='nl.townsandkingdoms.streamcontrol'
base.archivesName='streams-flow-control-fabric-26.1.2'
repositories { mavenCentral() }
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
java.withSourcesJar()
loom {
 
 runs { client { client(); runDir 'run-client'; vmArg '-Dstreamcontrol.uiPreview='+System.getProperty('streamcontrol.uiPreview','false'); programArg '--width'; programArg '960'; programArg '--height'; programArg '720' }; server { server(); runDir 'run'; vmArg '-Dstreamcontrol.integrationTest='+System.getProperty('streamcontrol.integrationTest','false'); vmArg '-Xmx3G'; programArg '--nogui' } }
}
dependencies {
 minecraft 'com.mojang:minecraft:26.1.2'
 
 implementation 'net.fabricmc:fabric-loader:0.18.4'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
 implementation files('libs/StreamsReflowing-26.1.2-fabric-2.17.3.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=25 }
tasks.named('jar') { from('LICENSE') }


apply from: 'release-tools/gradle/release.gradle'
