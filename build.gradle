plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = new groovy.json.JsonSlurper().parse(file('release.json')).version
group = 'nl.townsandkingdoms.streamcontrol'
base.archivesName = 'streams-flow-control-neoforge-26.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
neoForge {
    version = '26.3.0.95'
    runs {
        client {
            client()
            gameDirectory = file('run-client')
            programArgument '--width'
            programArgument '960'
            programArgument '--height'
            programArgument '720'
            systemProperty 'streamcontrol.uiPreview', System.getProperty('streamcontrol.uiPreview','false')
        }
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx3G'
            gameDirectory = file('run')
            systemProperty 'streamcontrol.integrationTest', System.getProperty('streamcontrol.integrationTest', 'false')
        }
    }
    mods { streamcontrol { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/StreamsReflowing-26.3-neoforge-2.17.1.jar')

}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
tasks.named('jar') { from('LICENSE') }


apply from: 'release-tools/gradle/release.gradle'
